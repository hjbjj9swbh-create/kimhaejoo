<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 명함</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #4A90E2; /* 메인 색상 */
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.8em;
        }

        h2 {
            color: #4A90E2; /* 메인 색상 */
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 500;
        }

        .contact-info p {
            color: #555;
            margin: 8px 0;
            font-size: 1em;
        }

        .contact-info a {
            text-decoration: none;
            color: #4A90E2;
            font-weight: 600;
        }

        .action-button {
            display: block;
            width: 80%;
            padding: 12px 0;
            margin: 25px auto 10px auto;
            background-color: #4A90E2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <img class="profile-image" src="https://via.placeholder.com/100" alt="프로필 사진">
        
        <h1>홍길동</h1>
        <h2>(주)인공지능 | AI 개발팀 팀장</h2>

        <div class="contact-info">
            <p>📧 이메일: <a href="mailto:gildong.hong@example.com">gildong.hong@example.com</a></p>
            <p>📱 전화: <a href="tel:010-1234-5678">010-1234-5678</a></p>
            <p>🔗 웹사이트: <a href="https://www.example.com" target="_blank">www.example.com</a></p>
        </div>

        <a class="action-button" href="#" onclick="alert('연락처 저장 기능 (VCF)은 백엔드 개발이 필요합니다.')">연락처 저장</a>
    </div>
</body>
</html>
